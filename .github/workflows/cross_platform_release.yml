name: Equinox Cross-Platform Binary Release & Checksums

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: equinox-node-linux-amd64
            ext: ""
          - os: ubuntu-24.04-arm
            artifact_name: equinox-node-linux-arm64
            ext: ""
          - os: windows-latest
            artifact_name: equinox-node-windows-amd64.exe
            ext: ".exe"
          - os: macos-latest
            artifact_name: equinox-node-macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Optimized equinox_node Release Binary
        run: cargo build --release --manifest-path crates/equinox_node/Cargo.toml

      - name: Stage Platform Binary
        shell: bash
        run: |
          mkdir -p dist
          cp "crates/equinox_node/target/release/equinox_node${{ matrix.ext }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload Platform Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  package-and-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Platform Binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Package Configs and Generate SHA-256 checksums.txt
        shell: bash
        run: |
          cd release-assets
          zip -j mainnet.zip ../configs/mainnet.toml
          zip -j testnet.zip ../configs/testnet.toml
          sha256sum equinox-node-* mainnet.zip testnet.zip > checksums.txt
          cat checksums.txt

      - name: Upload Complete Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Equinox-Node-CrossPlatform-Release-Bundle
          path: release-assets/*

      - name: Publish GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            FLAGS="--generate-notes"
            if [[ "$TAG" == *"-testnet"* || "$TAG" == *"-rc"* ]]; then
              FLAGS="$FLAGS --prerelease"
            fi
            gh release create "$TAG" release-assets/* \
              --title "Equinox Core ($TAG)" \
              $FLAGS
          fi