name: Build Equinox Android Super-Wallet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files & Build Release APK
        working-directory: Equinox-Super-Wallet/apps/mobile_flutter
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release

      - name: Upload Ready-to-Install Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Equinox-Super-Wallet-v0.2.0-Android-APK
          path: Equinox-Super-Wallet/apps/mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
