[package]
name = "equinox-core"
version = "1.0.0"
edition = "2021"
authors = ["Equinox Core Protocol Engineering"]
description = "Equinox (EQX) Audit-Grade Layer-1 Hybrid PoW/BFT UTXO Blockchain Core"

# কার্গো যাতে E:\ ড্রাইভের বাইরে গিয়ে ভুল Cargo.toml না খোঁজে (Screenshot 71 ফিক্স)
[workspace]

# মেইন বাইনারি ফাইলটির সুনির্দিষ্ট পাথ (Screenshot 72 ফিক্স)
[[bin]]
name = "equinox-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

sha2 = "0.10"
ripemd = "0.1"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
bs58 = "0.5"
hex = "0.4"

aes-gcm = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
rand = "0.8"

zeroize = { version = "1.8", features = ["derive"] }
rayon = "1.10"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true