# Production Audited Cryptography, Axum Server & PostgreSQL Dependencies
[package]
name = "equinox-exchange-production-server"
version = "1.0.0"
edition = "2021"

[dependencies]
# 1. Audited Standard Cryptography & Memory Security
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = { version = "0.10", features = ["aes"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hmac = "0.12"
bip39 = { version = "2.0", features = ["rand"] }
zeroize = { version = "1.8", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# 2. Central Matching Engine API & PostgreSQL Database (Prepared Statements Only)
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
